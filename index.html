function applyRememberUI(){try{const u=document.getElementById('lg_user');if(u)u.value='';}catch(e){}}
function hideLoginScreen(){const a=document.getElementById('authRoot');if(a){a.style.display='none';a.classList.remove('login-wrap');a.innerHTML='';}const ly=document.querySelector('.layout');if(ly)ly.style.display='';}
function setLoginErr(m){const e=document.getElementById('lg_err');if(e)e.textContent=m||'';}

let _loginFails=0,_loginLockUntil=0;
async function doLogin(){
  const uEl=document.getElementById('lg_user'),pEl=document.getElementById('lg_pass');
  if(Date.now()<_loginLockUntil){setLoginErr('محاولات كثيرة — انتظر '+(Math.ceil((_loginLockUntil-Date.now())/1000))+' ثانية وجرّب تاني');return;}
  /* تنسيق اسم المستخدم: شيل المسافات الزايدة — وعشان الإيميلات ما تفرقش بين حروف كبيرة وصغيرة */
  let u=(uEl&&uEl.value||'').trim();
  const p=(pEl&&pEl.value||'');
  if(!u||!p){setLoginErr('اكتب اسم المستخدم وكلمة السر');return;}
  const btn=document.getElementById('lg_btn');if(btn){btn.disabled=true;btn.textContent='جاري التحقق…';}
  await ensureSb();
  if(!sb){if(btn){btn.disabled=false;btn.textContent='دخول';}setLoginErr('الاتصال بالخادم غير جاهز — راجع إعداد الاتصال');return;}
  const _tryLogin=(uname)=>sb.rpc('app_login',{p_username:uname,p_password:p});
  try{
    let {data,error}=await _tryLogin(u);
    /* لو فشل والاسم فيه @ (إيميل) أو حروف كبيرة، جرّب بصيغة صغيرة — أسماء الدخول حساسة لحالة الحروف */
    const looksEmpty=(d)=>{const r0=(Array.isArray(d)?d[0]:d);return !r0||!r0.ok||!r0.username;};
    if(!error&&looksEmpty(data)){
      const lc=u.toLowerCase();
      if(lc!==u){const t2=await _tryLogin(lc);if(!t2.error&&!looksEmpty(t2.data)){data=t2.data;error=t2.error;u=lc;}}
    }
    if(btn){btn.disabled=false;btn.textContent='دخول';}
    if(error){
      const em=((error.message||'')+' '+(error.details||'')+' '+(error.hint||'')).toLowerCase();
      if(/unauthorized|invalid key|bad key|app_key|forbidden|401|403/.test(em)){
        setLoginErr('⚠️ خادم البيانات رفض مفتاح الاتصال — دي مشكلة إعدادات ومالهاش علاقة بحسابك. كلّم مسؤول النظام يظبّط المفتاح على الخادم.');
      }else if(/permission denied|row-level security|policy\b/.test(em)){
        setLoginErr('الخادم رفض صلاحية الحساب — راجع مع مسؤول النظام إن حسابك مفعّل.');
      }else if(/timeout|network|failed to fetch|load failed/.test(em)){
        setLoginErr('النت بطيء أو مقطوع — راجع الاتصال وجرّب تاني.');
      }else if(/function .* does not exist|could not find/i.test(em)&&/app_login/i.test(em)){
        setLoginErr('خدمة تسجيل الدخول غير متاحة على الخادم — راجع إعداد الاتصال.');
      }else{
        setLoginErr('تعذر الاتصال بالخادم — جرّب تحديث الصفحة (Ctrl+Shift+R) وادخل تاني.');
      }
      return;
    }
    const row=(Array.isArray(data)?data[0]:data);
    if(!row||!row.ok||!row.username){
      /* وضّح السبب الحقيقي اللي راجع من الدالة بدل الرسالة المضلّلة العامة */
      const msg=(row&&(row.message||row.error||row.reason))||'';
      if(msg){setLoginErr(msg);}
      else if(row&&row.active===false){setLoginErr('الحساب موقوف — كلّم المدير يفعّله.');}
      else{setLoginErr('اسم المستخدم أو كلمة السر غير صحيحة — راجع إنك بتكتبهم بالظبط زي ما اتسجّلوا (حروف كبيرة/صغيرة والمسافات).');}
      _loginFails=(_loginFails||0)+1;
      if(_loginFails>=5){_loginLockUntil=Date.now()+60000;_loginFails=0;setLoginErr('محاولات كثيرة — انتظر دقيقة قبل المحاولة تاني');return;}
      return;
    }
    _loginFails=0;
    session={username:row.username,name:row.name,role:row.role,companyId:row.company_id,companyName:row.company_name,costCenter:row.cost_center};
    issueAdminTicket(row.username,row.role);
    /* الخادم المحمي مابيرجّعش مستوى الشركة/المركز — بنجيبه من ملف المستخدمين بعد الدخول */
    try{await loadMyProfileFromUsers();}catch(e){}
    saveSession();hideLoginScreen();
    if(isReviewer())sel.view='pending';
    applyRolePerms();render();
    if(!cloud.enabled){try{cloudAutoStart();}catch(e){}}
    if(isReviewer()){try{await loadReviewerCompanies();}catch(e){}}
    loadPending();
  }catch(e){if(btn){btn.disabled=false;btn.textContent='دخول';}setLoginErr('خطأ: '+(e&&e.message||''));}
}

function _removeFromQuarters(row){
  if(!row)return;const c=state.companies.find(x=>x.id===row.company_id);if(!c)return;
  const y=c.years.find(x=>x.year===row.year);if(!y)return;const qk=String(row.quarter);if(!y.quarters[qk])return;

/* فلترة الفواتير المعلّقة — عرض/إخفاء الصفوف حسب الفلاتر بدون إعادة بناء */
function applyPendFilters(){
  const raw=val('pendSearch')||'';
  const q=raw.trim().toLowerCase();
  const comp=val('pendFltComp')||'',kind=val('pendFltKind')||'',st=val('pendFltStatus')||'';
  _pendFlt={q:raw,comp:comp,kind:kind,st:st};
  const tb=document.querySelector('#tbl_pending tbody');if(!tb)return;
  let shown=0;
  Array.from(tb.querySelectorAll('tr[data-id]')).forEach(tr=>{
    let ok=true;
    if(comp&&tr.getAttribute('data-comp')!==comp)ok=false;
    if(ok&&kind&&tr.getAttribute('data-kind')!==kind)ok=false;
    if(ok&&st&&tr.getAttribute('data-status')!==st)ok=false;
    if(ok&&q&&!(tr.textContent||'').toLowerCase().includes(q))ok=false;
    tr.style.display=ok?'':'none';if(ok)shown++;
  });
  const nm=document.getElementById('pendNoMatch');if(nm)nm.style.display=shown?'none':'';
}
function resetPendFilters(){const s=document.getElementById('pendSearch');if(s)s.value='';['pendFltComp','pendFltKind','pendFltStatus'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});applyPendFilters();}
/* يرجّع قيم الفلاتر بعد إعادة بناء الواجهة (زي التحديث) ثم يعيد تطبيقها */
function restorePendFilters(){const s=document.getElementById('pendSearch');if(!s)return;s.value=_pendFlt.q||'';const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v||'';};set('pendFltComp',_pendFlt.comp);set('pendFltKind',_pendFlt.kind);set('pendFltStatus',_pendFlt.st);applyPendFilters();}

/* ===== اعتماد/رفض جماعي ===== */
async function bulkApprove(){
  const ids=Array.from(_pendSel);if(!ids.length){toast('حدّد فاتورة واحدة على الأقل');return;}
  if(!confirm('اعتماد '+ids.length+' فاتورة مرة واحدة؟'))return;
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  showCloudLoad('⏫ جاري اعتماد '+ids.length+' فاتورة…');
  let ok=0,fail=0,imgWarn=0;
  for(let i=0;i<ids.length;i++){
    const r=await approveInvoice(ids[i],true);
    if(r&&r.ok){ok++;if(r.localOk===false)imgWarn++;}else fail++;
    showCloudLoad('⏫ جاري اعتماد '+(i+1)+' / '+ids.length+'…');
    await new Promise(r=>setTimeout(r,60));
  }
  _pendSel=new Set();saveState();updatePendingBadge();render();hideCloudLoad();
  toast('✅ تم اعتماد '+ok+' فاتورة'+(fail?(' • فشل '+fail):'')+(imgWarn?(' • '+imgWarn+' صورة لسه في السحابة'):''));
}
async function bulkReject(){
  const ids=Array.from(_pendSel);if(!ids.length){toast('حدّد فاتورة واحدة على الأقل');return;}
  let note=prompt('سبب الرفض (هيوصل للمستخدم) — ممكن تختار من: '+REJECT_PRESETS.join(' / '),'');
  if(note===null)return;note=(note||'').trim();if(!note){toast('لازم تكتب سبب الرفض');return;}
  if(!confirm('رفض '+ids.length+' فاتورة بنفس السبب؟'))return;
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  showCloudLoad('⏫ جاري رفض '+ids.length+' فاتورة…');
  let ok=0,fail=0;
  for(let i=0;i<ids.length;i++){
    if(await rejectInvoice(ids[i],note,true))ok++;else fail++;
    showCloudLoad('⏫ جاري رفض '+(i+1)+' / '+ids.length+'…');
    await new Promise(r=>setTimeout(r,60));
  }
  _pendSel=new Set();saveState();updatePendingBadge();render();hideCloudLoad();
  toast('↩️ تم رفض '+ok+' فاتورة'+(fail?(' • فشل '+fail):''));
}
/* يدور على فاتورة محلية بالـ id في أي ربع/شركة */
function findLocalInvoiceById(id){
  if(!id)return null;
  for(const c of state.companies)for(const y of (c.years||[]))for(const qk in (y.quarters||{})){const q=y.quarters[qk];for(const b of ['purchases','returns','sales']){const r=(q[b]||[]).find(x=>x&&x.id===id);if(r)return r;}}
  return null;
}
/* ==================================================================
   🏢 تصحيح شركة فاتورة (بعد الاعتماد أو قبله)
   المشكلة اللي بيحلها: فاتورة تتسجّل بالغلط على شركة، وبعد الاعتماد نكتشف إنها لشركة تانية.
   الحل: نقل الفاتورة كاملة (شركة + سنة + ربع) مع الاحتفاظ بنفس الـ id والمرفق.
   الأهم: بنتمسح بصمة الصف القديمة من _rowHash عشان المزامنة ترفع التصحيح فعلًا.
================================================================== */
function allQuartersFlat(){
  const out=[];
  for(const c of (state.companies||[])){
    for(const y of (c.years||[])){
      for(const qk in (y.quarters||{})){
        const q=y.quarters[qk]||{};
        for(const b of ['purchases','returns','sales','docs']){
          for(const r of (q[b]||[])){ if(r&&r.id) out.push({company:c,year:y,quarter:qk,key:b,row:r}); }
        }
      }
    }
  }
  return out;
}
function findInvoicePlace(id){
  if(!id)return null;
  return allQuartersFlat().find(x=>x.row.id===id)||null;
}
function companyHasYearQuarter(company,year,quarter){
  if(!company)return false;
  const y=(company.years||[]).find(x=>Number(x.year)===Number(year));
  if(!y)return false;
  return !!y.quarters[String(quarter)];
}
function quarterRowsOf(company,year,quarter,key){
  const y=(company.years||[]).find(x=>Number(x.year)===Number(year));
  if(!y)return null;
  const q=y.quarters[String(quarter)];
  if(!q)return null;
  return q[key]||(q[key]=[]);
}
/* ينقل فاتورة من شركة/سنة/ربع لشركة/سنة/ربع تانية — بترجع {ok,msg,from,to} */
function relocateInvoice(id,targetCompanyId,targetYear,targetQuarter,newDate){
  const place=findInvoicePlace(id);
  if(!place) return {ok:false,msg:'الفاتورة مش موجودة على الجهاز'};
  const tc=(state.companies||[]).find(c=>c.id===targetCompanyId);
  if(!tc) return {ok:false,msg:'الشركة الهدف مش موجودة'};
  const sameCompany=place.company.id===tc.id;
  const sameQ=Number(place.quarter)===Number(targetQuarter)&&Number(place.year.year)===Number(targetYear);
  if(sameCompany&&sameQ){ if(newDate)place.row.invoiceDate=newDate; saveState(); return {ok:true,msg:'مفيش تغيير — نفس الشركة ونفس الربع',moved:false}; }
  /* تأكيد السنة والربع موجودين في الشركة الهدف (ننشئهم لو مش موجودين) */
  let ty=(tc.years||[]).find(x=>Number(x.year)===Number(targetYear));
  if(!ty){ ty={year:Number(targetYear),quarters:{1:emptyQuarter(),2:emptyQuarter(),3:emptyQuarter(),4:emptyQuarter()}}; tc.years.push(ty); }
  const qk=String(targetQuarter);
  if(!ty.quarters[qk]) ty.quarters[qk]=emptyQuarter();
  const dest=ty.quarters[qk][place.key]||(ty.quarters[qk][place.key]=[]);
  if(dest.some(x=>x.id===id)) return {ok:false,msg:'الفاتورة موجودة بالفعل في المكان الهدف'};
  /* نسخة من الصف — بنحتفظ بنفس الـ id والمرفق والحالة (اعتماد/معلّقة) */
  const row=Object.assign({},place.row);
  if(newDate)row.invoiceDate=newDate;
  if(place.key==='sales'){ if(!row.date||newDate)row.date=row.invoiceDate||row.date||''; }
  dest.push(row);
  /* نحذف من المصدر */
  const srcQ=place.year.quarters[String(place.quarter)];
  if(srcQ&&srcQ[place.key]) srcQ[place.key]=srcQ[place.key].filter(x=>x.id!==id);
  /* 🚨 المهم: نمسح بصمة الصف عشان المزامنة ترفع company_id/year/quarter الجديدة */
  try{_markDirty([id]);}catch(e){}
  saveState();
  return {ok:true,moved:true,msg:'✅ اتنقلت لـ «'+tc.name+'» — سنة '+targetYear+' — '+qName(targetQuarter),
    from:place.company.name+' / '+place.year.year+' / '+qName(place.quarter),
    to:tc.name+' / '+targetYear+' / '+qName(targetQuarter)};
}
/* بعد النقل، لو الفاتورة لها سجل اعتماد/رفع في السحابة بنصحّحه فورًا (لو المزامنة شغالة) */

/* ☁️→💾 ينزّل صورة الفاتورة المعتمدة جوّه الجهاز (IndexedDB) ويتأكد إنها اتخزنت.
   يرجّع true لو الصورة بقت محفوظة محليًا (أو مفيش صورة أصلًا) — وساعتها بس نقدر نمسح من السحابة بأمان. */
async function pullApprovedAttachment(localRow,attUrl){
  if(!localRow)return false;
  if(localRow.attachmentId){try{const f=await getFile(localRow.attachmentId);if(f){if(!localRow.attachmentUrl&&attUrl)localRow.attachmentUrl=attUrl;return true;}}catch(e){}}
  if(!attUrl)return true;/* مفيش صورة أصلًا — مفيش حاجة نخاف عليها */
  try{
    const resp=await fetch(attUrl);
    if(!resp||!resp.ok)return false;
    const blob=await resp.blob();
    if(!blob||!blob.size)return false;
    const aid=uid();
    await putFile(aid,blob);
    const chk=await getFile(aid);/* تحقق إن الصورة فعلًا اتكتبت */
    if(!chk||!chk.size)return false;
    localRow.attachmentId=aid;
    /* ☁️ رابط السحابة بيفضل متسجّل — النسخة المحلية مجرد كاش عرض سريع */
    if(attUrl)localRow.attachmentUrl=attUrl;
    return true;
  }catch(e){console.warn('pullApprovedAttachment',e);return false;}
}

      else toast('✅ تم الاعتماد ودخلت الربع'+(attUrl?' — الصورة اتخزنت على الجهاز':'')+' — الفاتورة محفوظة في السحابة');}

/* ===== سجل المراجعة (Audit Log) ===== */
const AUDIT_KEY='vat_audit_log_v1';
let _audit=null;
function auditLoad(){if(_audit)return _audit;try{_audit=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]')||[];}catch(e){_audit=[];}return _audit;}
function auditSave(){try{localStorage.setItem(AUDIT_KEY,JSON.stringify(_audit.slice(0,2000)));}catch(e){}}
/* اسم المراجع يتسجّل دايمًا: من الجلسة، وإلا من قائمة المستخدمين (الاسم الظاهر)، وإلا اسم اليوزر */
function _auditReviewerName(){
  if(session&&session.name)return session.name;
  try{const u=(_usersCache||[]).find(x=>x&&x.username===(session&&session.username));if(u&&(u.display_name||u.name))return u.display_name||u.name;}catch(e){}
  return (session&&session.username)||'';
}
function auditAdd(action,id,row,ok,note){
  const log=auditLoad();
  const c=row&&state.companies.find(x=>x.id===(row&&row.company_id));
  /* الاسم لازم يتحفظ دايمًا — وبعدّه اليوزر كضمان */
  const nm=_auditReviewerName()||(session&&session.username)||'غير معروف';
  const entry={
    eid:uid(),ts:Date.now(),action:action,ok:!!ok,id:id||'',
    user:(session&&session.username)||'',name:nm,role:(session&&session.role)||'',
    supplier:(row&&(row.supplier_name||row.supplier))||'',
    company:(c&&c.name)||((row&&row.company_name)||(row&&row.company_id))||'',
    company_id:(row&&row.company_id)||'',
    amount:row&&(row.total_amount!=null?row.total_amount:row.amount),
    date:(row&&(row.invoice_date||row.date))||'',
    entered_by:(row&&(row.entered_by_name||row.entered_by))||'',
    note:note||''
  };
  log.unshift(entry);
  const _keep=log.slice(0,2000);_audit=_keep;auditSave();
  /* ☁️ الحفظ على السيرفر — مضمون لأن app_settings جدول مسموح */
  try{pushAuditCloud();}catch(e){console.warn('audit push',e);}
}
/* ==================================================================
   ☁️ حفظ السجل على السيرفر في جدول app_settings (الجدول الوحيد المسموح)
   المفتاح: reviewlog::<username>   — صف واحد لكل مراجع فيه حركاته.
   سبب اختيار المفتاح ده: أي مفتاح يبدأ بـ audit:: بيتحذف تلقائيًا
   بواسطة cleanupOldAuditRows، فكنا هنمسح سجلنا بنفسنا.
   ================================================================== */
const AUDIT_CLOUD_PREFIX='reviewlog::';
const AUDIT_ROW_MAX=400;      /* أقصى عدد حركات في صف واحد */
const AUDIT_VALUE_MAX=60000;  /* حدود آمنة لحجم القيمة */

/* يبني صف السجل لكل مراجع (من السجل المحلي + اللي مسحوب من السحابة) */
function _auditRowsByUser(){
  const out={};
  const push=(e)=>{
    if(!e||!e.eid)return;
    const u=String(e.user||e.name||'').trim()||'unknown';
    (out[u]||(out[u]=[])).push(e);
  };
  (auditLoad()||[]).forEach(push);
  (_auditCloud||[]).forEach(push);
  return out;
}

/* رفع سجل كل مراجع لصفه في app_settings */
async function pushAuditCloud(){
  try{
    await ensureSb();if(!sb||!cloud.enabled)return;
    const byUser=_auditRowsByUser();
    /* لو مفيش جلسة حالياً، نرفع السجل الخاص بالمالك/المستخدم الحالي فقط عند وجوده */
    const me=(session&&session.username)||'';
    const users=Object.keys(byUser);
    if(!users.length)return;
    for(const u of users){
      if(me&&u!==me&&!isAdmin())continue;   /* المراجع يرفع سجله هو فقط */
      let arr=byUser[u];
      arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
      arr=arr.slice(0,AUDIT_ROW_MAX);
      let val=JSON.stringify(arr);
      /* لو الحجم كبير، نقلّل العدد تدريجيًا لحد ما يدخل في الحد الآمن */
      while(val.length>AUDIT_VALUE_MAX&&arr.length>20){arr=arr.slice(0,Math.floor(arr.length*0.7));val=JSON.stringify(arr);}
      /* ⚡ ما نرفعش نفس السجل تاني — الـ JSON الكامل كان بيتكتب كل شوية في D1 */
      const _lk='_audit_sig::'+u;let _hp='';try{_hp=_hashRow(arr).slice(0,0)+String(arr.length)+':'+(arr[0]&&arr[0].eid||'')+':'+(arr[arr.length-1]&&arr[arr.length-1].eid||'');}catch(e){}
      try{if(_hp&&localStorage.getItem(_lk)===_hp)continue;}catch(e){}
      await sb.from('app_settings').upsert({key:AUDIT_CLOUD_PREFIX+u,value:val},{onConflict:'key'});
      try{localStorage.setItem(_lk,_hp);}catch(e){}
    }
  }catch(e){console.warn('pushAuditCloud',e);}
}

async function pullAuditFromCloud(){
  try{await ensureSb();if(!sb||!cloud.enabled)return;
    const arr=[];
    /* المصدر الأساسي: صف لكل مراجع (reviewlog::<username>) */
    try{

      let rows=(res&&res.data)||[];
      /* لو الـ Worker رفض like، نجرب جلب كل المفاتيح ونفلتر محليًا */
      if(!rows.length){
        try{const res2=await sb.from('app_settings').select('key,value');if(res2&&res2.data)rows=res2.data.filter(x=>String(x.key||'').indexOf(AUDIT_CLOUD_PREFIX)===0);}catch(_){}
      }
      rows.forEach(r=>{
        try{
          const v=JSON.parse(r.value||'null');
          if(Array.isArray(v))v.forEach(function(e){if(e&&(e.action||e.eid)){if(!e.eid)e.eid=uid();arr.push(e);}});
        }catch(_){}
      });
    }catch(_){}
    /* توافق خلفي: سجلات قديمة كانت متخزنة بمفاتيح audit:: */
    try{const res=await sb.from('app_settings').select('key,value').like('key','audit::%');

    }catch(_){}

    try{const r1=await sb.from('audit_log').select('*').order('ts',{ascending:false}).limit(2000);
      if(r1&&r1.data){r1.data.forEach(r=>{arr.push({eid:r.eid||uid(),ts:num(r.ts)||(r.created_at?Date.parse(r.created_at):0),action:r.action,ok:r.ok!==false,id:r.invoice_id||'',user:r.reviewer_user||'',name:r.reviewer_name||'',role:r.reviewer_role||'',supplier:r.supplier||'',company:r.company||'',company_id:r.company_id||'',amount:(r.amount==null?null:num(r.amount)),date:r.invoice_date||'',note:r.note||''});});}

    }catch(_){}

  }catch(e){
    console.warn('pullAudit',e);
    _auditCloudStatus={ok:false,msg:'تعذر جلب السجل من السحابة: '+((e&&e.message)||e),users:0,count:0,at:Date.now()};
  }

/* يطلّع مسار الملف جوّه الـ storage bucket من رابط عام، بيشيل الـ query (?v=) والـ prefix بتاع الـ bucket */
function storagePathFromUrl(url){
  if(!url)return '';
  let s=String(url).split('?')[0].split('#')[0];
  const marker='/'+CLOUD_BUCKET+'/';
  const i=s.indexOf(marker);
  if(i>-1){try{return decodeURIComponent(s.slice(i+marker.length));}catch(e){return s.slice(i+marker.length);}}
  try{return decodeURIComponent(s.split('/').pop());}catch(e){return s.split('/').pop();}
}

        if(url){

          cloudSet[_attKeyFromUrl(url)]=1;up++;
        }else fail++;
      }catch(e){console.warn('force upload',e);fail++;}
    }
    /* المستندات الحرة */
    for(const d of (q.docs||[])){
      if(!d||!d.attachmentId)continue;

      try{

      }catch(e){console.warn('force upload doc',e);}

  try{await redownloadAllAttachments();}catch(e){}
}
/* ☁️☁️ رفع الصورة للسحابة. المهم هنا: الصورة عمرها ما تتسجّل «مرفوعة» غير لما نتأكد إنها
   فعلًا بقت على التخزين السحابي. زمان كانت بتتنطّى لو الصف كان متخزّن محليًا (localOnly)،
   فصور الفواتير المعتمدة كانت تفضل على الجهاز لوحده — لو الكاش اتمسح تروح خلاص. */
async function cloudUploadAttachment(att){if(!sb||!cloud.enabled||!att)return null;try{
  const blob=await dataURLtoBlob(att.dataURL);
  if(!blob||!blob.size)return null;
  /* مسار منظّم: <company>/<year>-Q<quarter>/<attachmentId>.jpg — عشان نلاقيها بسهولة ومتتلخبطش */
  const _cid=(att.companyId||(att.rowId&&(()=>{try{for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters)for(const b of ['purchases','returns','sales','docs'])for(const r of (y.quarters[qk][b]||[]))if(r.id===att.rowId)return c.id;}catch(e){}return 'shared';})())||'shared');
  const _yr=att.year||new Date().getFullYear(), _qt=att.quarter||(Math.floor(new Date().getMonth()/3)+1);
  const _base=String(att.name||('img_'+Date.now())).replace(/[^a-zA-Z0-9._-]/g,'_').replace(/^.*[\\/]/,'');
  const path=_cid+'/'+_yr+'-Q'+_qt+'/'+(_base.includes('.')?_base:_base+'.jpg');
  const up=await sb.storage.from(CLOUD_BUCKET).upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg'});
  if(up&&up.error){console.warn('upload',up.error);return null;}
  const pub=sb.storage.from(CLOUD_BUCKET).getPublicUrl(path);
  const url=(pub.data&&pub.data.publicUrl)||null;
  /* ✅ تأكيد: نتأكد إن الملف موجود فعلًا على السحابة قبل ما نقول «اترفع» */
  if(url){try{const chk=await fetch(url,{method:'HEAD',cache:'no-store'});if(!chk||!chk.ok){console.warn('[صور] الملف مش متأكد من وجوده على السحابة',url,chk&&chk.status);return null;}}catch(e){/* فشل التحقق شبكيًا — منعتبرهاش فشل */}}
  return url;
}catch(e){console.warn('upload',e);return null;}}

/* --- حفظ صفوف المرفقات (صور الموبايل) من القاعدة إلى IndexedDB --- */
/* ⚡ تنزيل صور الموبايل الجديدة — بيسأل السحابة عن الصور اللي لسه معندناش بس (بدل ما يسحب قائمة كاملة كل مرة) */
const ATT_PULL_KEY='vat_att_pulled_v1';
function _attPulled(){try{return JSON.parse(localStorage.getItem(ATT_PULL_KEY)||'{}')||{};}catch(e){return {};}}
function _attPulledSave(o){try{localStorage.setItem(ATT_PULL_KEY,JSON.stringify(o));}catch(e){}}
async function downloadRemoteAttachments(){
  if(!sb||!cloud.enabled)return false;
  /* لو لسه سحبناها قريب (أقل من 5 دقايق) نطنّش — حماية من التكرار */
  const now=Date.now();
  if(window._attLastPull && (now-window._attLastPull)<1800000)return false;
  window._attLastPull=now;
  let changed=false;
  try{
    const res=await _fetchAllPaged('invoices','id,attachment_url',function(q){return q.not('attachment_url','is','null');});
    if(res.error||!res.data)return false;
    const pulled=_attPulled();
    for(const row of res.data){
      const url=row.attachment_url;if(!url||!row.id)continue;
      let target=null,hasLocal=false;
      for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r&&r.id===row.id){target=r;if(r.attachmentId)hasLocal=true;}}}
      if(!target||hasLocal){if(target)pulled[row.id]=url;continue;}
      /* لو نفس الرابط اتسحب قبل كده للصف ده، ما نعيدهوش */
      if(pulled[row.id]===url && !target.attachmentId){continue;}
      try{
        const resp=await fetch(url);if(!resp.ok)continue;
        const blob=await resp.blob();const aid=uid();await putFile(aid,blob);
        target.attachmentId=aid;target.attachmentUrl=url;
        pulled[row.id]=url;changed=true;
      }catch(e){console.warn('dl',e);}
    }
    _attPulledSave(pulled);
  }catch(e){console.warn('downloadRemoteAttachments',e);}
  if(changed)saveStateLocal();
  return changed;
}


/* ⚡ جلب كل الصفوف بصفحات (السيرفر بيقصّ الرد على حد أقصى) — عشان مايفوتناش صور */
async function _fetchAllPaged(table,cols,extra){
  const out=[];let off=0,cap=1000;const seen={};
  for(let g=0;g<60;g++){
    let q=sb.from(table).select(cols);if(extra)q=extra(q);
    const pg=await q.range(off,off+cap-1);
    if(pg.error)return {data:out,error:pg.error};
    const rows=pg.data||[];let nw=0;
    for(const r of rows){const id=r&&r.id;if(id){if(!seen[id]){seen[id]=1;out.push(r);nw++;}}else{out.push(r);nw++;}}
    if(!rows.length||nw===0)break;
    cap=rows.length;off+=cap;
  }
  return {data:out,error:null};
}
/* ============================================================================
   🗂️ تقرير تغطية الصور — بيقارن «اللي على التخزين السحابي فعلاً» (قائمة الملفات)
   مع «اللي في قاعدة البيانات» و«اللي على الجهاز». مش تخمين: بيعدّ الملفات الحقيقية.
   ============================================================================ */
function _attKeyFromUrl(u){
  try{const s=String(u||'');const i=s.indexOf('/object/public/'+CLOUD_BUCKET+'/');if(i>=0)return decodeURIComponent(s.slice(i+('/object/public/'+CLOUD_BUCKET+'/').length));const k=s.lastIndexOf('/'+CLOUD_BUCKET+'/');if(k>=0)return decodeURIComponent(s.slice(k+CLOUD_BUCKET.length+2));}catch(e){}
  return '';
}
async function listAllCloudFiles(){
  /* الخادم بيرجّع أسماء الملفات كاملة بالمسار (شركة/سنة-ربع/اسم.jpg) — بنلفّ بـ offset */
  const all=[];const seen={};let offset=0;
  for(let g=0;g<120;g++){
    const r=await sb.storage.from(CLOUD_BUCKET).list('',{limit:100,offset:offset});
    if(r&&r.error){console.warn('list files',r.error);break;}
    const arr=(r&&r.data)||[];
    if(!arr.length)break;
    for(const f of arr){const nm=(f&&f.name)||'';if(!nm)continue;if(!seen[nm]){seen[nm]=1;all.push(nm);}}
    if(arr.length<100)break;
    offset+=100;
  }
  return all;
}
async function cloudFilesForCompany(companyId){
  /* قائمة ملفات شركة واحدة — المسار بيتحدد بالشركة/السنة-الربع */
  try{const r=await sb.storage.from(CLOUD_BUCKET).list(companyId,{limit:1000,offset:0});if(r.error||!r.data)return null;const out=[];for(const d of r.data){const nm=d&&d.name;if(!nm)continue;if(/\.[a-z0-9]{2,5}$/i.test(nm)){out.push(companyId+'/'+nm);}else{const sub=await sb.storage.from(CLOUD_BUCKET).list(companyId+'/'+nm,{limit:1000,offset:0});for(const f of ((sub&&sub.data)||[]))if(f&&f.name&&/\.[a-z0-9]{2,5}$/i.test(f.name))out.push(companyId+'/'+nm+'/'+f.name);}}return out;}catch(e){return null;}
}
async function attachmentReport(){
  const rep={at:new Date().toISOString(),cloudFiles:0,cloudPerCompany:{},dbRows:0,dbWithUrl:0,
    localRows:0,localFiles:0,onlyLocal:[],dbWithoutFile:0,urlNotInBucket:[]};
  try{const files=await listAllCloudFiles();rep.cloudFiles=files.length;const set={};files.forEach(f=>{set[f]=1;const c=f.split('/')[0]||'—';rep.cloudPerCompany[c]=(rep.cloudPerCompany[c]||0)+1;});rep._set=set;}
  catch(e){rep.cloudErr=String(e&&e.message||e);}
  /* صفوف قاعدة البيانات */
  try{const r=await _fetchAllPaged('invoices','id,company_id,attachment_url');const rows=(r&&r.data)||[];rep.dbRows=rows.length;
    for(const row of rows){if(row.attachment_url){rep.dbWithUrl++;const key=_attKeyFromUrl(row.attachment_url);if(rep._set&&key&&!rep._set[key])rep.urlNotInBucket.push(key);}}
  }catch(e){rep.dbErr=String(e&&e.message||e);}
  /* الجهاز: صفوف + ملفات فعلية */
  try{
    const ids=[];rep.localRows=0;
    for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];
      for(const b of ['purchases','returns','sales','docs'])for(const r of (q[b]||[])){if(!r)continue;if(b!=='docs')rep.localRows++;if(r.attachmentId){ids.push({id:r.attachmentId,rowId:r.id,url:r.attachmentUrl||''});}}}
    const got=await getFilesBatch(ids.map(x=>x.id));
    for(const it of ids){const f=got[it.id];if(f&&(!f.size||f.size>0))rep.localFiles++;const key=_attKeyFromUrl(it.url);if(!key||!rep._set||!rep._set[key])rep.onlyLocal.push(it);}
  }catch(e){rep.localErr=String(e&&e.message||e);}
  delete rep._set;
  return rep;
}

/* تنزيل أي صورة على السحابة ولسه مش على الجهاز — ومكتوب فوقها إنها على السحابة */
async function downloadAllMissingAttachments(){
  if(!sb||!cloud.enabled){toast('⚠️ شغّل المزامنة الأول');return;}
  let dn=0;
  try{
    const r=await _fetchAllPaged('invoices','id,attachment_url',function(q){return q.not('attachment_url','is','null');});
    const rows=(r&&r.data)||[];if(!rows.length){toast('ℹ️ مفيش صور على السحابة');return;}
    for(const row of rows){
      const url=row.attachment_url;if(!url)continue;
      let target=null,has=false;
      for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const rr of (q[b]||[])){if(rr&&rr.id===row.id){target=rr;if(rr.attachmentId){const f=await getFile(rr.attachmentId);if(f&&(!f.size||f.size>0))has=true;}}}}
      if(!target)continue;
      if(!target.attachmentUrl)target.attachmentUrl=url;
      if(has)continue;
      showCloudLoad('⬇️ جاري تنزيل الصور من السحابة… ('+(dn+1)+')');
      try{const resp=await fetch(url);if(!resp.ok)continue;const blob=await resp.blob();if(!blob||!blob.size)continue;const aid=uid();await putFile(aid,blob);const chk=await getFile(aid);if(!chk)continue;target.attachmentId=aid;dn++;}
      catch(e){console.warn('dl att',e);}
    }
    saveState();
  }catch(e){console.warn('downloadAllMissingAttachments',e);}
  hideCloudLoad();
  toast(dn?('✅ نزّلنا '+dn+' صورة من السحابة للجهاز'):'✅ كل صور السحابة موجودة على الجهاز');
}
/* --- دفع كل البيانات المحلية إلى السحابة --- */
async function cloudPushAll(silent){if(!sb||!cloud.enabled)return;if(state&&state._cloudResetPending&&silent)return;
  /* ⚡ inFlight: يمنع أي رفع متوازي. لو فيه رفع شغّال بنطلب واحد كمان بعد ما يخلص بس (واحد مش عشرة) */
  if(_pushInFlight){if(!silent)_pushQueued=true;else _pushQueued=true;return;}
  _pushInFlight=true;
  /* ⚡ atts بيتعرّف هنا (بره الـ try) عشان يفضل متاح بعد الـ finally لرفع الصور */
  const atts=[];
  try{
  if(!silent)showCloudLoad('⏫ جاري رفع الشركات…');
  /* الشركات: رفع دفعة واحدة */
  if(!_bulkSynced||!silent){try{const comps=state.companies.map(c=>({id:c.id,name:c.name,tax_number:c.taxNumber||null}));if(comps.length){const uc=await sb.from('companies').upsert(comps,{onConflict:'id'});if(uc.error)console.warn('push companies',uc.error);}}catch(e){console.warn('companies',e);}}
  const rowsRaw=[];const _rh=_rowHashMap();const _newHash={};
  for(const c of state.companies){for(const y of c.years){for(const qk in y.quarters){const q=y.quarters[qk];for(const kind of ['purchases','returns','sales']){const bucket=kind==='sale'?'sales':(kind==='return'?'returns':'purchases');for(const r of (q[bucket]||[])){/* بقى بنرفع كل حاجة بما فيها localOnly والمعلّقة - عشان كل بيانات الجهاز تبقى على السحابة */
    const type=kind==='purchases'?'purchase':(kind==='returns'?'return':'sale');
    const ser=serialiseInvoice(r,type,y.year,parseInt(qk),c.id);
    const hs=_hashRow(ser);_newHash[r.id]=hs;
    /* ⚡ نرفع بس اللي اتغيّر فعلاً — الباقي محفوظ في السحابة بالفعل */
    if(_rh[r.id]!==hs)rowsRaw.push(ser);
    if(r.attachmentId&&!r.attachmentUrl)atts.push({id:r.attachmentId,rowId:r.id});
  }}}}}
  /* شيل أي فاتورة مكررة بنفس الـ id — التكرار بيتعب القاعدة ويرفض الدفعة */
  const _seenRow={};const rows=rowsRaw.filter(x=>{if(!x||!x.id)return false;if(_seenRow[x.id])return false;_seenRow[x.id]=1;return true;});
  /* ⚡ الرفع الخلفي التلقائي ما يرفعش أكتر من AUTO_PUSH_MAX صف في المرة — الباقي في الرفع اليدوي */
  if(silent&&rows.length>AUTO_PUSH_MAX){
    /* ما نتجاهلش الكل — نرفع أول AUTO_PUSH_MAX والتاني يتمم في الدورة اللي بعدها */
    console.warn('auto push trimmed — pending',rows.length,'of max',AUTO_PUSH_MAX);
    rows.splice(AUTO_PUSH_MAX);
    _autoPushLeft=true;
  }
  if(rows.length){if(!silent)showCloudLoad('⏫ جاري رفع '+rows.length+' فاتورة…');
    if(_ccColMissing)rows.forEach(x=>{if(x)delete x.cost_center;});
    /* رفع الفواتير على دفعات أصغر + إعادة محاولة فردية لو الدفعة فشلت */
    for(let i=0;i<rows.length;i+=PUSH_BATCH){const chunk=rows.slice(i,i+PUSH_BATCH);let up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});
      if(up.error&&_isCcColErr(up.error)){
        /* عمود مركز التكلفة ناقص — نحاول إضافته، ولو ماقدرناش نرفع بدونه */
        const fixed=await ensureCostCenterColumn();
        if(fixed){up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});try{await pushCcQueue();}catch(e){}}
        if(up.error&&_isCcColErr(up.error)){_ccColMissing=true;rows.forEach(x=>{if(x&&x.cost_center){_ccQueue[x.id]=x.cost_center;delete x.cost_center;}});chunk.forEach(x=>{if(x)delete x.cost_center;});ccQueueSave();up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});}
      }
      if(!up.error){
        /* ✅ اترفعت — نخزّن بصمتها عشان ما نبعتهاش تاني
           ⚠️ لكن الأول نتأكد إن السيرفر حفظها فعلاً بقراءة راجعة بالـ id.
           لو السيرفر ردّ نجاح وهو حافظ جزء بس، ما نسجّلش بصمة الصفوف الناقصة
           عشان تتبعت تاني في الدورة الجاية (ده كان سبب «فيه 1 على السحابة»). */
        let _verified=null;
        try{const _ids=chunk.map(x=>x&&x.id).filter(Boolean);
          const _back=await sb.from('invoices').select('id').in('id',_ids);
          if(_back&&!(_back.error)){const _got={};for(const _b of (_back.data||[]))if(_b&&_b.id)_got[_b.id]=1;_verified=_got;}
        }catch(e){console.warn('verify push',e);}
        try{const h=_rowHashMap();for(const row of chunk){if(!row||!row.id)continue;
          if(_verified&&!_verified[row.id])continue; /* السيرفر مش حافظها — ما تسجّلش بصمتها */
          if(_newHash[row.id])h[row.id]=_newHash[row.id];}_rowHashSave();}catch(e){}
      }
      if(up.error){console.warn('push invoices',up.error);
        /* لو الدفعة فشلت، جرّب كل صف لوحده عشان نعرف المتعب ونحفظ الباقي */
        let oneFail=0,oneOk=0;const _rh2=_rowHashMap();
        for(const row of chunk){const u1=await sb.from('invoices').upsert(row,{onConflict:'id'});if(u1.error){oneFail++;}else{oneOk++;if(row&&row.id&&_newHash[row.id])_rh2[row.id]=_newHash[row.id];}}
        _rowHashSave();
        if(!silent)toast(oneOk?('⚠️ نُقلت '+oneOk+' فاتورة وفشلت '+oneFail):('⚠️ تعذر رفع '+oneFail+' فاتورة'));
        if(!oneOk&&oneFail){break;} /* لو كلها فشلت نتوقف */
      }}}
  /* ⚡ نمسح بصمات الفواتير المحلية/المحذوفة من الخريطة (مش هترجع للسحابة) */
  try{const _h=_rowHashMap();let _ch=false;for(const id in _h){if(!_newHash[id]){delete _h[id];_ch=true;}}if(_ch)_rowHashSave();}catch(e){}

  /* الموردين: رفع دفعة واحدة (بدل 170 طلب منفصل) */
  if(!_bulkSynced||!silent){try{if(!silent)showCloudLoad('⏫ جاري رفع الموردين…');const _seenSup={};const sups=state.suppliers.map(s=>({id:s.id,name:s.name,tax_number:s.taxNumber||null})).filter(s=>{if(!s.id||_seenSup[s.id])return false;_seenSup[s.id]=1;return true;});for(let i=0;i<sups.length;i+=200){const chunk=sups.slice(i,i+200);const us=await sb.from('suppliers').upsert(chunk,{onConflict:'id'});if(us.error){console.warn('push suppliers',us.error);break;}}}catch(e){console.warn('suppliers',e);}
  await cloudSaveSetting('vat_rate',VAT_RATE);
  await cloudSaveAICfg();
  await cloudSaveCostCentersList();
  }
  /* ☁️ المستندات الحرة + صورها */
  try{await syncDocFiles();}catch(e){}
  try{await cloudPushDocs(false);}catch(e){}
  _bulkSynced=true;
  /* المرفقات (صور): ترفع في الخلفية بعد ما تقفل النافذة */
  if(!silent){hideCloudLoad();toast('✅ تم رفع '+state.companies.length+' شركة و'+rows.length+' فاتورة للسحابة');}
  }catch(_pushErr){console.warn('cloudPushAll',_pushErr);}
  finally{_pushInFlight=false;if(_pushQueued){_pushQueued=false;setTimeout(function(){try{cloudPushAll(true);}catch(e){}},4000);}
    /* فيه صفوف لسه محتاجة رفع من نفس الدورة — نكمّل بعد شوية بدل ما نستنى تفاعل المستخدم */
    else if(_autoPushLeft){_autoPushLeft=false;setTimeout(function(){try{cloudPushAll(true).then(function(){autoSyncAttachments(true);}).catch(function(){});}catch(e){}},6000);}}
  if(atts.length){for(const a of atts){try{const blob=await getFile(a.id);if(!blob||!blob.size)continue;
    /* ☁️ بنرفع الصورة بنفس الرابط اللي هيتربط بيه الصف — فلو الرفع نجح وما قدرناش نحدّث الصف،
       الصورة تفضل موجودة على السحابة ويتملا الرابط في الدورة الجاية بدل ما تتبعت تاني وتتوه. */
    const url=await cloudUploadAttachment({name:a.id+'.jpg',rowId:a.rowId,dataURL:await blobToDataURL(blob)});
    if(url){const upd=await sb.from('invoices').update({attachment_url:url}).eq('id',a.rowId);if(!upd.error){for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r.id===a.rowId)r.attachmentUrl=url;}}}}}catch(e){console.warn('push att',e);}}saveState();}
}


/* ============ فحص ذاتي للمزامنة (اتصال + كتابة + قراءة + تخزين) ============ */
async function syncSelfTest(){
  const out=[]; const t0=Date.now();
  const push=(ok,txt)=>{out.push((ok?'✅':'❌')+' '+txt);};
  const box=document.getElementById('syncTestOut');
  function paint(){if(box)box.innerHTML='<div style="font-family:monospace;font-size:12.5px;line-height:1.9;white-space:pre-wrap">'+out.join('\n')+'</div>';}
  paint();
  try{
    if(!sb){push(false,'مفيش اتصال — شغّل المزامنة الأول');paint();return;}
    /* 1) قراءة الشركات من الخادم */
    let r=await sb.from('companies').select('id,name').limit(1);
    push(!r.error,'قراءة الشركات '+(r.error?('— '+(r.error.message||'')):('('+(r.data||[]).length+' صف)')));
    /* 2) قراءة إعدادات النظام (بدون كتابة أي صف) */
    r=await sb.from('app_settings').select('key').limit(1);
    push(!r.error,'قراءة الإعدادات '+(r.error?('— '+(r.error.message||'')):'OK'));
    /* 3) قراءة قائمة المستخدمين لصاحب الصلاحية */
    /* ✅ مفتاح الإدارة اتلغى — بنتأكد بس إن الخادم بيقبل طلب الإدارة من حساب المدير */
    if(!isAdmin()){push(true,'مش حساب مدير — تخطّي فحص الإدارة');}
    else{
      r=await sb.rpc('app_list_users',{p_admin_key:''});
      const _em=String((r&&r.data&&r.data.error)||(r&&r.error&&r.error.message)||'');
      if(/admin key/i.test(_em))push(false,'الخادم لسه بيطلب مفتاح إدارة — محتاج تحديث كود الخادم');
      else push(!_em,'صلاحية المدير من الجلسة '+(_em?('— '+_em):'OK'));
    }
    /* 4) التحديث اللحظي */
    push(!!rtChannel,'التحديث اللحظي '+(rtChannel?'مفعّل':'مقفول'));
    /* 5) العدّادات */
    const n=countLocalInvoices();
    push(true,'فواتير على الجهاز: '+n);
    push(true,'آخر فحص استغرق '+((Date.now()-t0)/1000).toFixed(1)+' ثانية');
  }catch(e){push(false,'خطأ: '+(e.message||e));}
  paint();
}

/* ================= 🩺 فحص سلامة البيانات (قراءة فقط — مابيكتبش أي حاجة) ================= */
/* الغرض: تعرف بالظبط إيه اللي على المتصفح، وإيه اللي على السحابة، وإيه الفرق بينهم،
   وكام صورة لسه مالهاش نسخة محلية. الفحص ده مايعملش أي كتابة — آمن تمامًا. */
async function runHealthCheck(){
  const out={at:new Date().toISOString(),readOnly:true};
  /* --- 1) المحلي --- */
  let local=0, localWithAtt=0, localWithoutAtt=0;
  const perCompany={};
  try{
    for(const c of (state.companies||[])){
      let n=0;
      for(const y of (c.years||[])) for(const qk in (y.quarters||{})){
        const q=y.quarters[qk];
        for(const b of ['purchases','returns','sales']) for(const r of (q[b]||[])){
          n++; local++;
          if(r.attachmentId||r.attachmentUrl) localWithAtt++; else localWithoutAtt++;
        }
      }
      perCompany[c.name||c.id]=n;
    }
  }catch(e){out.localErr=String(e&&e.message||e);}
  out.localInvoices=local; out.localWithAtt=localWithAtt; out.localWithoutAtt=localWithoutAtt;
  out.perCompanyLocal=perCompany;

  /* --- 2) هل فيه تغييرات لسه محتاجة رفع؟ (مقارنة بالبصمة — مفيش أي طلب سيرفر) --- */
  let pending=0;
  try{ pending=_pendingUploadCount(); }catch(e){ out.pendingErr=String(e&&e.message||e); }
  out.pendingUpload=pending;

  /* --- 3) المرفقات: بنفحص الملف الفعلي في IndexedDB، مش مجرد وجود رقم الارتباط ---
     الباج القديم: كان بيعدّ أي فاتورة عندها attachmentId كأن صورتها موجودة. */
  let attInDb=0, missingFiles=[], emptyIds=[];
  try{
    const ids=collectAttIds();
    if(ids.length){
      const CH=200;
      for(let i=0;i<ids.length;i+=CH){
        const got=await getFilesBatch(ids.slice(i,i+CH));
        for(const id of ids.slice(i,i+CH)){
          const v=got[id];
          if(v==null) missingFiles.push(id);
          else if(v.size!==undefined && v.size===0) emptyIds.push(id);
          else attInDb++;
        }
      }
    }
  }catch(e){ out.attErr=String(e&&e.message||e); }
  out.attachmentsEmpty=emptyIds.length;
  if(emptyIds.length) missingFiles=missingFiles.concat(emptyIds);
  out.attachmentsInBrowser=attInDb;
  out.attachmentsMissingFile=missingFiles.length;

  /* --- 4) صندوق الإرسال على الموبايل (لو فاضي مش مشكلة) --- */
  try{
    if(window.indexedDB){
      const has=await new Promise(res=>{ const rq=indexedDB.open('vat_scanner_outbox',1);
        rq.onsuccess=()=>{const db=rq.result;res(db.objectStoreNames.contains('queue'));};
        rq.onerror=()=>res(false); rq.onupgradeneeded=()=>{}; });
      out.mobileOutboxPresent=!!has;
    }
  }catch(e){}

  /* --- 5) السحابة: عدد الصفوف بس (طلب خفيف، بدون سحب البيانات) --- */
  try{
    if(sb&&cloud&&cloud.enabled){
      /* ⚠️ المحوّل بتاعنا مش بيدعم count/head — فبنعدّ الصفوف بجلب صفحات صغيرة
         (السيرفر بيقصّ النتيجة على حد أقصى افتراضي، فبنطلب حد كبير + نعدّ بالـ id).
         ده طلب قراءة بس، ومفيش أي تعديل على البيانات. */
      let _cN=0,_cErr=null;const _seenC={};let _off=0,cap=1000;
      for(let _g=0;_g<60;_g++){const _pg=await sb.from('invoices').select('id').range(_off,_off+cap-1);
        if(_pg.error){_cErr=(_pg.error&&_pg.error.message)||'خطأ في القراءة';break;}
        const _rows=(_pg.data||[]);let _new=0;
        for(const _r of _rows){const _id=_r&&_r.id;if(_id&&!_seenC[_id]){_seenC[_id]=1;_new++;}}
        _cN+=_new;
        /* السيرفر غالبًا بيردّ بأقل من اللي طلبناه — فنتقدّم بحجم الرد الفعلي مش اللي طلبناه */
        if(!_rows.length||_new===0)break;
        cap=_rows.length;_off+=cap;}
      if(_cErr)out.cloudErr=_cErr;else out.cloudInvoices=_cN;
    }else{ out.cloudEnabled=false; }
  }catch(e){ out.cloudErr=String(e&&e.message||e); }

  /* --- 6) السعة --- */
  try{ if(navigator.storage&&navigator.storage.estimate){ const est=await navigator.storage.estimate(); out.quotaMB=Math.round((est.quota||0)/1048576); out.usedMB=+((est.usage||0)/1048576).toFixed(1); } }catch(e){}

  out.verdict=[];
  const _netErr=/fetch is not defined|failed to fetch|network|load failed/i.test(String(out.cloudErr||''));
  if(out.cloudErr) out.verdict.push({t:_netErr?'amber':'red',
    m:(_netErr?'مش قادر أوصل للسحابة دلوقتي (النت أو الخادم) — بيانات الجهاز تحت سليمة ومحفوظة' :('السحابة بترجّع خطأ: '+out.cloudErr))});
  if(pending>0) out.verdict.push({t:'amber',m:'فيه '+pending+' فاتورة متعدّلة على الجهاز ولسه ماترفعتش للسحابة'});
  if(out.attachmentsMissingFile>0) out.verdict.push({t:'amber',m:'فيه '+out.attachmentsMissingFile+' فاتورة مسجّل عليها صورة لكن **ملف الصورة نفسه مش محفوظ على الجهاز**. الحالة دي بتحصل غالبًا لأن الفواتير دي اتفتحت على جهاز تاني أو بعد ما المتصفح مسح الكاش — مش معناها إن الفاتورة ضاعت. اضغط «تنزيل كل صور الفواتير من السحابة» ف يرجّعها من السحابة.'});
  if(out.localInvoices===0) out.verdict.push({t:'amber',m:'مفيش أي فاتورة على المتصفح — لو عندك بيانات، اعمل «مزامنة الآن» الأول'});
  if(out.attachmentsMissingFile>0) out.verdict.push({t:'amber',m:'فيه '+out.attachmentsMissingFile+' فاتورة مسجّل لها صورة لكن ملفها مش موجود على المتصفح — اضغط «⬇️ تنزيل الصور الناقصة من السحابة»'});
  if(out.localWithAtt>0&&out.attachmentsInBrowser===0) out.verdict.push({t:'red',m:'مفيش أي ملف صورة محفوظ على المتصفح — كل الصور على السحابة بس'});
  try{ out.cloudFiles=(await listAllCloudFiles()).length; }catch(e){ out.cloudFilesErr=String(e&&e.message||e); }
  if(!out.verdict.length) out.verdict.push({t:'green',m:'كل حاجة متسقة: بياناتك على الجهاز ومحدّثة على السحابة'});

  try{ console.log('🩺 نتيجة الفحص:',out); }catch(e){}
  return out;
}

/* --- زر يدوي: رفع كل بيانات الجهاز للسحابة --- */
async function cloudPushAllManual(){if(!sb||!cloud.enabled){toast('⚠️ شغّل المزامنة الأول');return;}showCloudLoad('⏫ جاري رفع البيانات…');try{_rowHash={};_rowHashSave();await cloudPushAll(false);await autoSyncAttachments(false);}catch(e){console.warn(e);toast('⚠️ حصل خطأ أثناء الرفع');}hideCloudLoad();}
function cloudPushAllSoon(){if(!sb||!cloud.enabled||applyingRemote||(state&&state._cloudResetPending))return;
  clearTimeout(pushTimer);
  /* ⏱️ 3 ثواني بدل 8 — لو المستخدم قفل التبويب بسرعة، التعديل يترفع بدل ما يتلغي.
     التعديلات المتتالية لسه بتتجمع في رفع واحد. */
  pushTimer=setTimeout(function(){pushTimer=null;var sig='';
    try{sig=state.companies.length+'|'+_pendingUploadCount();}catch(e){}
    /* لو نفس الحاجة اترفعت خلاص ومفيش تغيير — بلاش أي طلب
       ⚠️ لكن مش بنقفل الرفع نهائيًا: أي تغيير في العدد يفتحه تاني،
       ولو فيه صفوف لسه محتاجة رفع من دورة سابقة ما نستناش */
    var _pendNow=0;try{_pendNow=_pendingUploadCount();}catch(e){}
    if(_pendNow<=0&&sig&&sig===_lastPushSig&&!_autoPushLeft){return;}
    _lastPushSig=sig;
    cloudPushAll(true).then(()=>autoSyncAttachments(true)).catch(()=>{});
  },3000);
}
/* 🔴 لو المستخدم قفل التبويب أو خبّى الصفحة وفيه حاجة لسه محتاجة رفع — نرفعها فورًا قبل ما يمشي.
   كان قبل كده التعديل الأخير يضيع لأنه كان مستني 8 ثواني. */
function flushPushOnLeave(){
  try{
    if(!sb||!cloud.enabled||applyingRemote)return;
    if(typeof pushTimer!=='undefined'&&pushTimer){clearTimeout(pushTimer);pushTimer=null;}
    var pend=0;try{pend=_pendingUploadCount();}catch(e){pend=0;}
    if(pend>0){cloudPushAll(true).then(function(){try{autoSyncAttachments(true);}catch(e){}}).catch(function(){});}
  }catch(e){console.warn('flushPushOnLeave',e);}
}
window.addEventListener('pagehide',flushPushOnLeave,{capture:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)flushPushOnLeave();});
/* عدد الفواتير اللي فعلاً محتاجة رفع (مقارنة بالبصمة) — بدون أي طلب سيرفر */
function _pendingUploadCount(){var n=0;var _rh=_rowHashMap();try{for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const kind of ['purchases','returns','sales']){const bucket=kind==='sale'?'sales':(kind==='return'?'returns':'purchases');for(const r of (q[bucket]||[])){if(!r||isDeleted(r.id))continue;const type=kind==='purchases'?'purchase':(kind==='returns'?'return':'sale');const hs=_hashRow(serialiseInvoice(r,type,y.year,parseInt(qk),c.id));if(_rh[r.id]!==hs)n++;}}}}catch(e){}return n;}

/* ===== 🗑️ مسح السحابة خالص + تفريغ البرنامج (من غير أي إعادة رفع) ===== */

  if(pushTimer){clearTimeout(pushTimer);pushTimer=null;}
  try{await cloudInit();}catch(e){}
  if(!sb){hideCloudLoad();toast('⚠️ تعذر الاتصال — راجع الرابط والمفتاح');applyingRemote=false;return;}
  try{
    showCloudLoad('🗑️ جاري مسح الشركات والفواتير…');
    await cloudWipeTable('invoices','id');
    await cloudWipeTable('companies','id');
    await cloudWipeTable('suppliers','id');
    try{const rs=await sb.from('app_settings').delete().not('key','is','null');if(rs.error)console.warn('wipe app_settings',rs.error);}catch(e){}
    showCloudLoad('🧹 جاري مسح صور الفواتير من السحابة…');

    /* 2) فرّغ البرنامج نفسه: بيانات + صور */

    const _ai=state.aiCfg||{};
    state={companies:[],suppliers:[],theme:state.theme||'dark',lastBackup:'',vatRate:VAT_RATE||15,aiCfg:{endpoint:_ai.endpoint||'https://api.openai.com/v1/chat/completions',model:_ai.model||'gpt-4o-mini',key:_ai.key||'',keys:_ai.keys||[],flash:_ai.flash!==false},_cloudResetPending:false};
    saveSettingsLocal();
    try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
    sel={companyId:null,year:null,quarter:null,tab:'purchases'};
    /* 3) رجّع المزامنة شغالة وهي فاضية (تراقب اللحظي + المؤقّت) */
    state._cloudResetPending=false;
    try{cloudSubscribe();}catch(e){}
    startAutoSyncLoop();markCloud();render();
    hideCloudLoad();
    alert('✅ تم مسح السحابة وتفريغ البرنامج بنجاح.\n\n• السحابة فاضية بالكامل.\n• البرنامج على هذا الجهاز بقى جديد (مفيش شركات ولا فواتير).\n\nدلوقتي تقدر تعمل «⬆️ استرجاع» للنسخة الاحتياطية، والمزامنة التلقائية هترفعها للسحابة لوحدها.');
    toast('✅ تم مسح السحابة وتفريغ البرنامج — جاهز للاسترجاع');
  }catch(e){console.warn('wipeReset',e);hideCloudLoad();toast('⚠️ حصل خطأ أثناء المسح: '+(e.message||e));}

/* ===== ♻️ إعادة ضبط السحابة من هذا الجهاز (تفريغ القديم + رفع الحالي) ===== */
async function cloudWipeTable(table,col){try{const r=await sb.from(table).delete().not(col,'is','null');if(r.error)console.warn('wipe',table,r.error);return !r.error;}catch(e){console.warn('wipe',table,e);return false;}}
async function cloudEmptyBucket(){try{for(let guard=0;guard<80;guard++){const l=await sb.storage.from(CLOUD_BUCKET).list('',{limit:100,offset:guard*100});if(l.error||!l.data||!l.data.length)break;const names=l.data.map(f=>f.name).filter(n=>n&&n!=='.emptyFolderPlaceholder');if(names.length){const rm=await sb.storage.from(CLOUD_BUCKET).remove(names);if(rm.error){console.warn('bucket rm',rm.error);break;}}if(l.data.length<100)break;}}catch(e){console.warn('empty bucket',e);}}
async function cloudResetFromThisDevice(){
  if(!cloud.url||!cloud.key){toast('⚠️ اكتب عنوان الخادم ومفتاح العميل الأول واحفظهم');return;}

  if(!confirm('تأكيد أخير: مفيش رجوع بعد المسح. نبدأ إعادة الضبط؟'))return;
  closeModal();showCloudLoad('⏳ جاري تجهيز الاتصال…');
  await cloudInit();
  if(!sb){hideCloudLoad();toast('⚠️ تعذر الاتصال — راجع الرابط والمفتاح');return;}
  cloud.enabled=true;saveCloudCfg();
  applyingRemote=true;try{cloudUnsubscribe();}catch(e){}
  try{
    showCloudLoad('🗑️ جاري تفريغ السحابة…');
    await cloudWipeTable('invoices','id');
    await cloudWipeTable('companies','id');
    await cloudWipeTable('suppliers','id');
    try{const rs=await sb.from('app_settings').delete().not('key','is','null');if(rs.error)console.warn('wipe app_settings',rs.error);}catch(e){}
    showCloudLoad('🧹 جاري حذف صور السحابة القديمة…');
    await cloudEmptyBucket();
    /* شيل روابط الصور القديمة محليًا عشان تترفع من جديد */
    for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){r.attachmentUrl='';}}
    showCloudLoad('⏫ جاري رفع بيانات هذا الجهاز…');
    await cloudPushAll(false);
    showCloudLoad('🖼️ جاري رفع صور الفواتير…');
    await autoSyncAttachments(false);
    state._cloudResetPending=false;saveState();
    try{cloudSubscribe();}catch(e){}startAutoSyncLoop();markCloud();render();
    hideCloudLoad();
    let total=0;for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];total+=(q.purchases||[]).length+(q.returns||[]).length+(q.sales||[]).length;}
    alert('✅ تمت إعادة ضبط السحابة بنجاح.\n\n• الشركات: '+state.companies.length+'\n• الفواتير: '+total+'\n\nالسحابة دلوقتي مطابقة بالظبط لبيانات هذا الجهاز.');
    toast('✅ تمت إعادة ضبط السحابة — رُفعت '+state.companies.length+' شركة و'+total+' فاتورة');
  }catch(e){console.warn('reset',e);hideCloudLoad();toast('⚠️ حصل خطأ أثناء إعادة الضبط: '+(e.message||e));}
  finally{setTimeout(()=>{applyingRemote=false;},1500);}
}

/* ====== مزامنة صور الفواتير تلقائيًا (رفع + تنزيل) ====== */
let _attSyncing=false;
async function autoSyncAttachments(silent){
  if(!sb||!cloud.enabled||_attSyncing)return;
  _attSyncing=true;
  let uploaded=0,downloaded=0;
  try{
    /* 1) رفع أي صورة محفوظة محليًا ولسه مالهاش رابط سحابي */
    for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){
      const q=y.quarters[qk];
      for(const b of ['purchases','returns','sales','docs']){
        for(const r of (q[b]||[])){
          /* ☁️ كل صورة على الجهاز لازم يكون لها نسخة على السحابة — حتى المعتمدة (localOnly).
             الرابط اللي مش متأكدين منه (attachmentUrl) بيوقف الرفع، فبنرفع لو مفيش attachmentUrl
             أو لو الصورة اتعلمت «محتاجة رفع» (_attDirty) أو الصورة موجودة محليًا والرابط مش متأكد.
             عشان كده شلنا شرط !localOnly اللي كان بيسيب صور الاعتماد على الجهاز بس. */
          if(r.attachmentId && !r.attachmentUrl && !isDeleted(r.id)){
            try{
              const blob=await getFile(r.attachmentId);
              if(!blob)continue;
              const url=await cloudUploadAttachment({name:r.attachmentId+'.jpg',dataURL:await blobToDataURL(blob)});
              if(url){ r.attachmentUrl=url; try{await sb.from('invoices').update({attachment_url:url}).eq('id',r.id);}catch(e){} uploaded++; }
            }catch(e){console.warn('att upload',e);}
          }
        }
      }
    }
  }catch(e){console.warn('autoSyncAttachments up',e);}
  /* 1ب) ☁️ الصفوف اللي في السحابة من غير رابط صورة، ومعانا صورتها على الجهاز (ومحفوظة قبل كده
     كـ localOnly) — بنرفعها ونحدّث رابطها في السحابة. ده اللي كان بيتخطّى ويسيب الصور على الجهاز بس. */
  try{
    if(sb&&cloud.enabled){
      const need=[];const seenIds={};
      for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];
        for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){
          if(r&&r.attachmentId&&!r.attachmentUrl&&!isDeleted(r.id)&&!seenIds[r.id]){seenIds[r.id]=1;need.push(r);}
        }}
      if(need.length){
        const ids=need.map(r=>r.id);
        /* نسأل السحابة مرة واحدة: مين من الصفوف دي معندوش attachment_url */
        for(let i=0;i<ids.length;i+=50){
          const part=ids.slice(i,i+50);
          const res=await sb.from('invoices').select('id,attachment_url').in('id',part);
          const map={};(res&&res.data||[]).forEach(x=>{map[x.id]=x.attachment_url||'';});
          for(const r of need){
            if(!(r.id in map))continue;
            if(map[r.id]){r.attachmentUrl=map[r.id];continue;}   /* عنده صورة على السحابة خلاص */
            try{
              const blob=await getFile(r.attachmentId);if(!blob||!blob.size)continue;
              const url=await cloudUploadAttachment({name:r.attachmentId+'.jpg',rowId:r.id,dataURL:await blobToDataURL(blob)});
              if(url){r.attachmentUrl=url;try{await sb.from('invoices').update({attachment_url:url}).eq('id',r.id);}catch(e){}uploaded++;}
            }catch(e){console.warn('att upload backfill',e);}
          }
        }
      }
    }
  }catch(e){console.warn('autoSyncAttachments backfill',e);}
  /* 2) تنزيل صور الموبايل الجديدة للجهاز */
  try{ const ch=await downloadRemoteAttachments(); if(ch)downloaded++; }catch(e){}
  try{ saveState(); }catch(e){}
  _attSyncing=false;
  if(!silent && (uploaded||downloaded))toast('📎 تمت مزامنة الصور'+(uploaded?(' • رُفع '+uploaded):'')+(downloaded?' • تنزيل جديد':''));
}

/* مؤقّت مزامنة دوري (شبكة أمان لو المزامنة اللحظية انقطعت) */
let _autoSyncTimer=null;
function startAutoSyncLoop(){
  if(_autoSyncTimer)clearInterval(_autoSyncTimer);
  _autoSyncTimer=setInterval(()=>{
    if(!session)return;                       /* ما نعملش مزامنة وإحنا على شاشة الدخول */
    if(document.hidden)return;                /* ⚡ بلاش أي طلبات والتطبيق في الخلفية */
    if(!navigator.onLine)return;
    if(cloud.enabled&&sb&&!applyingRemote){
      /* ⚡ مزامنة تلقائية كاملة: أي فاتورة على الجهاز مش مرفوعة تترفع لوحدها كل دقيقة */
      try{if(_pendingUploadCount()>0)cloudPushAll(true).catch(function(){});}catch(e){}
      /* ⚡ مزامنة الصور كل 10 دقايق بدل كل دقيقة، وسجل المراجعة كل 30 دقيقة */
      _attTick=(_attTick||0)+1;
      if(_attTick%10===1)autoSyncAttachments(true).catch(()=>{});
      if(isOwner())collectApprovedToOwner().catch(()=>{});
      _auditTick=(_auditTick||0)+1;
      if(_auditTick%30===1){
        try{pushAuditCloud();}catch(e){}
        if(isAdmin()||isOwner()){pullAuditFromCloud().then(()=>{if(sel.view==='audit')render();}).catch(()=>{});}
      }
    }
  },60000);
}

/* --- قراءة كل البيانات من السحابة عند فتح البرنامج --- */
async function cloudLoadAll(){if(!sb){return;}
  /* ☁️ السحابة هي المصدر: بعد السحب بنمسح الكاش المحلي ونكتبه من جديد على مضمون السحابة.
     كده مستحيل يفضل على الجهاز فاتورة/شركة مش موجودة على السحابة ويعيش وهم إنها محفوظة. */

  /* ⚡ نطلب الأعمدة اللي محتاجينها بس — مش * (الـ * بيرجّع مرفقات وبايتات زيادة في كل فتحة) */
  const INV_COLS='id,company_id,year,quarter,kind,supplier_name,tax_number,invoice_number,invoice_date,cost_center,base_amount,vat_amount,total_amount,attachment_url,status,entered_by,entered_by_name,approved_by';
  if(!_isRev){
  /* ⚡ السيرفر بيرجّع بحد أقصى 1000 صف في الرد (ومابيدعمش offset)، فبنطلب الحد الأقصى
     وبنعدّ اللي وصل. لو وصل 1000 بالظبط يبقى ممكن يكون فيه أكتر — بننبّه بدل ما نفضل ساكتين. */
  /* ⚡⚡ سحب كل الصفوف بصفحات: كان قبل كده limit(1000) بس، فلو عندك أكتر من 1000 فاتورة
     الباقي مكانش بينزل على الجهاز خالص (وبالتالي مكانش بيتزامن صح). دلوقتي بنلفّ على كل الصفحات. */
  let _pulled=0,_pageErr=null;
  try{
    const rowsAll=await _fetchAllPaged('invoices',INV_COLS,function(q){return q.order('id',{ascending:true});});
    if(rowsAll&&rowsAll.error)_pageErr=rowsAll.error;
    if(rowsAll&&rowsAll.data){_pulled=rowsAll.data.length;for(const r of rowsAll.data){const k=r.kind==='sale'?'sale':(r.kind==='return'?'return':'purchase');setFromRow(k,r,r.year,r.quarter);}}
  }catch(e){console.warn('pull invoices',e);}
  window._invPulled=_pulled;
  if(_pageErr){try{console.warn('[D1] سحب الفواتير ناقص',_pageErr);}catch(e){}}
  }else{try{console.log('[D1] مراجع — تم تخطي سحب كل الفواتير');}catch(e){}}
  const ss=await sb.from('suppliers').select('id,name,tax_number');if(ss.data){for(const s of ss.data){let x=state.suppliers.find(v=>v.id===s.id);if(!x)x=state.suppliers.find(v=>v.name===s.name);if(!x)state.suppliers.push({id:s.id,name:s.name,taxNumber:s.tax_number||''});else{x.name=s.name;x.taxNumber=s.tax_number||'';}}}
  const st=await sb.from('app_settings').select('key,value');if(st.data){for(const r of st.data){if(r.key==='vat_rate'&&num(r.value)>0&&num(r.value)!==VAT_RATE){applyVatRate(num(r.value));}if(r.key==='ai_model'&&r.value)state.aiCfg.model=r.value;if(r.key==='ai_endpoint'&&r.value)state.aiCfg.endpoint=r.value;
    /* 🔑 المفاتيح بتيجي من السحابة — عشان مسح كاش المتصفح ما يضيّعش رصيدك */

  try{await cloudLoadDocs();}catch(e){}

function cloudUnsubscribe(){if(rtChannel&&sb){try{sb.removeChannel(rtChannel);}catch(e){}rtChannel=null;}}
function cloudSubscribe(){if(!sb)return;cloudUnsubscribe();applyingRemote=true;rtChannel=sb.channel('vat_realtime').on('postgres_changes',{event:'*',schema:'public',table:'invoices'},(p)=>{const r=p.new||p.old;if(!r)return;const k=r.kind==='sale'?'sale':(r.kind==='return'?'return':'purchase');try{if(p.eventType==='DELETE'){const _o=p.old||{};if(_o.id){try{_removeFromQuarters(_o);}catch(e){}removeRow(k,_o,true);scheduleRealtimeRefresh(0);}}else{applyRow(k,r,true);if(isOwner()&&r&&r.status==='approved'){scheduleCollectApproved();}}/* نعدّ الفواتير الجديدة فقط (INSERT) عشان التحديثات ورواجع الرفع ما تعملش إشعار */scheduleRealtimeRefresh(p.eventType==='INSERT'?1:0);}catch(e){console.warn('rt',e);}}).on('postgres_changes',{event:'*',schema:'public',table:'companies'},(p)=>{try{const r=p.new||p.old;if(!r)return;let c=state.companies.find(x=>x.id===r.id);if(!c&&p.eventType!=='DELETE'){c={id:r.id,name:r.name,taxNumber:r.tax_number||'',years:[]};state.companies.push(c);}else if(c){c.name=r.name;c.taxNumber=r.tax_number||'';}saveStateLocal();scheduleRealtimeRefresh(0);}catch(e){}}).subscribe((s)=>{setTimeout(()=>{applyingRemote=false;},1500);});}

  +'<button class="ghost sm" style="border-color:#22c55e;color:#4ade80" onclick="syncSelfTest()">🧪 فحص المزامنة</button>'

  +'<button class="ghost sm" onclick="downloadAllMissingAttachments()">⬇️ تنزيل الصور الناقصة من السحابة</button>'
  +'<button class="ghost sm" style="border-color:#22c55e;color:#4ade80" onclick="forceUploadAllDeviceImages()">⬆️ رفع صور الجهاز للسحابة</button>'
  +'<button class="ghost sm" style="color:#fbbf24;border-color:rgba(251,191,36,.4)" onclick="wipeDeviceCache()">🧹 مسح كاش هذا الجهاز</button>'
  +'<button class="ghost sm" style="color:#f87171" onclick="stopCloud();closeModal();">⏸️ إيقاف المزامنة</button>'
  +'<button class="ghost sm" onclick="closeModal()">إغلاق</button></div>'
  +(state._cloudResetPending?'<div style="margin-top:14px;padding:12px;border:1px solid #f59e0b;border-radius:10px;background:rgba(245,158,11,.1);color:#fcd34d;font-size:13px;line-height:1.7">⚠️ في بيانات مستوردة على هذا الجهاز لسه ما اترفعتش للسحابة. اضغط زر إعادة الضبط تحت.</div>':'')
  +'<div style="margin-top:16px;padding-top:14px;border-top:1px dashed #2a3550">'
  +'<p style="color:#8b98b8;font-size:12px;line-height:1.7;margin:0 0 10px">🗑️ مسح كل البيانات من السحابة نهائيًا وترجيع البرنامج جديد فاضي. الزر ده <b>مابيرفعش أي حاجة تاني</b> — بعده اعمل «⬆️ استرجاع» للنسخة الاحتياطية والمزامنة التلقائية هترفعها لوحدها.</p>'
  +'<button class="btn" style="background:#dc2626;border-color:#dc2626" onclick="cloudWipeAndReset()">🗑️ مسح السحابة خالص وتفريغ البرنامج</button></div>'
  +'<div id="attReportBox" style="display:none;margin-top:12px;padding:12px;border-radius:10px;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.3);font-size:13px"></div>'
  +'<div id="syncTestOut" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid #24314b"></div>'
  +'<p style="color:#7c8aa8;font-size:12px;margin-top:14px;line-height:1.6">🔒 المفتاح المضمّن مفتاح عميل عام: بيبدأ الطلبات بس، والصلاحيات بتتحدد من الخادم حسب جلسة المستخدم.<br>♻️ المزامنة تشتغل تلقائيًا: أول ما تفتح البرنامج، ومع كل فاتورة تضيفها، وكل 45 ثانية، مع رفع وتنزيل صور الفواتير.</p>';showModal(html);}
async function saveCloudAndStart(){const u=val('cl_url').trim().replace(/\/$/,'');const k=val('cl_key').trim();const cid=val('cl_company');if(!u||!k){toast('⚠️ اكتب الرابط والمفتاح');return;}cloud.url=u;cloud.key=k;cloud.companyId=cid||null;await loadSupaLib();try{sb=window.supabase.createClient(u,k);}catch(e){sb=null;}if(!sb){toast('⚠️ تعذر الاتصال — راجع الرابط والمفتاح');return;}cloud.enabled=true;saveCloudCfg();await cloudLoadAll();closeModal();await startCloud();startAutoSyncLoop();markCloud();render();toast('☁️ اتصل بالسحابة والمزامنة شغالة');}

loadCloudCfg();
/* --- اتصال تلقائي بالكامل: لو المفاتيح محفوظة يتصل ويزامن لوحده --- */
async function cloudAutoStart(){if(!cloud.url||!cloud.key)return;await loadSupaLib();if(!(window.supabase&&window.supabase.createClient))return;await cloudInit();if(!sb){cloud.enabled=false;markCloud();return;}cloud.enabled=true;try{await flushCloudDeletes();}catch(e){console.warn('flush del',e);}try{await repairWronglyDeleted();}catch(e){console.warn('repair del',e);}try{await ensureCostCenterColumn();}catch(e){}try{await cloudLoadAll();}catch(e){console.warn('auto load',e);}try{await pushCcQueue();}catch(e){}
  /* ☁️ السحابة هي الأساس: بنسحب الأول، وبعدها بنرفع أي حاجة محلية لسه مش مرفوعة (مش بنرفع «نسخة قديمة» فوق السحابة) */
  try{await cloudPushAll(true);}catch(e){console.warn('auto push',e);}for(const c of state.companies){try{await cloudSaveCompany(c.id);}catch(e){}}try{await cloudSaveAICfg();}catch(e){}try{await autoSyncAttachments(true);}catch(e){}try{cloudSubscribe();}catch(e){}startAutoSyncLoop();markCloud();render();toast('☁️ تم الاتصال التلقائي والمزامنة');}
setTimeout(cloudAutoStart,400);
/* إعادة المحاولة لما يرجع النت أو يرجع للصفحة */
window.addEventListener('online',()=>{if(cloud.enabled){cloudPushAllSoon();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.enabled){try{cloudLoadAll().then(()=>autoSyncAttachments(true)).catch(()=>{});}catch(e){}}});
</script>
</body>
